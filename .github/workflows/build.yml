name: Build ImmortalWrt packages

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    name: ${{ matrix.version }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.1"
            arch: x86_64
            sdk: immortalwrt-sdk-24.10.1-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk gettext git \
            libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget zstd

      - name: Download and unpack SDK
        run: |
          base="https://downloads.immortalwrt.org/releases/${{ matrix.version }}/targets/x86/64"
          curl -fSL --retry 3 -o sdk.tar.zst "$base/${{ matrix.sdk }}"
          mkdir sdk
          tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Copy packages into SDK
        run: |
          cd sdk
          # kernel module (oaf/kmod-oaf) runs on the PVE host, not inside the
          # container; drop the dependency so the ipk installs cleanly
          sed -i 's/ +kmod-oaf//' ../luci-app-oaf/Makefile
          cp -r ../open-app-filter package/open-app-filter
          cp -r ../luci-app-oaf package/luci-app-oaf

      - name: Update and install feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd sdk
          echo "CONFIG_PACKAGE_appfilter=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-oaf=y" >> .config
          make defconfig

      - name: Build
        run: |
          cd sdk
          make -j"$(nproc)" package/appfilter/compile package/luci-app-oaf/compile || \
            make -j1 package/appfilter/compile package/luci-app-oaf/compile V=s

      - name: Collect ipk files
        run: |
          mkdir -p out
          find sdk/bin/packages -name '*.ipk' -exec cp -v {} out/ \;
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.version }}-${{ matrix.arch }}
          path: out/*.ipk
